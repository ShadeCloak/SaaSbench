name: datahub_smoke

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: dh-smoke-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  broker:
    image: confluentinc/cp-kafka:7.4.0
    container_name: dh-smoke-broker
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_MESSAGE_MAX_BYTES: 5242880
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    container_name: dh-smoke-schema-registry
    depends_on:
      broker:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker:29092
    ports:
      - "8081:8081"
    healthcheck:
      test: curl -sS --fail http://localhost:8081/subjects || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  mysql:
    image: mysql:8.0
    container_name: dh-smoke-mysql
    environment:
      MYSQL_DATABASE: datahub
      MYSQL_USER: datahub
      MYSQL_PASSWORD: datahub
      MYSQL_ROOT_PASSWORD: datahub
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin --default-authentication-plugin=mysql_native_password
    ports:
      - "3308:3306"
    healthcheck:
      test: mysqladmin ping -h localhost -u datahub -pdatahub
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

  elasticsearch:
    image: elasticsearch:7.17.9
    container_name: dh-smoke-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx512m
    ports:
      - "9201:9200"
    healthcheck:
      test: curl -sS --fail http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=0s
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - esdata:/usr/share/elasticsearch/data

  neo4j:
    image: neo4j:4.4-community
    container_name: dh-smoke-neo4j
    environment:
      NEO4J_AUTH: neo4j/datahub
      NEO4J_dbms_default__database: graph
      NEO4J_dbms_memory_heap_max__size: 512M
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: wget -qO- http://localhost:7474 || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-setup:
    # round-24 L2 fix: pin -> v1.5.0.6 (2026-05-11 stable release). The previous
    # round-22 used :v0.13.0, which acryldata has removed from docker hub (manifest unknown);
    # we briefly tried :head, but head is a rolling trunk build, and between it and the round-21 evaluation period (v0.13)
    # the schema/API has changed substantially, so running on head only scores 78.9%. v1.5.0.x is acryldata's current
    # truly released LTS-style tag (https://hub.docker.com/r/acryldata/datahub-frontend-react/tags),
    # with better compatibility + reproducibility, consistent with the round-21 real score of 95.2%.
    # NOTE: kafka-setup has no separate release tag in the v1.5.x series, so use the latest available v1.2.0.1
    # (it is just a one-shot init container that exits after running, with no strong version-consistency requirement against the main image)
    image: acryldata/datahub-kafka-setup:v1.2.0.1
    container_name: dh-smoke-kafka-setup
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      DATAHUB_PRECREATE_TOPICS: "false"

  datahub-upgrade:
    image: acryldata/datahub-upgrade:v1.5.0.6
    container_name: dh-smoke-upgrade
    command: ["-u", "SystemUpdate"]
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      - DATAHUB_SQL_SETUP_ENABLED=true
      - EBEAN_DATASOURCE_DRIVER=com.mysql.jdbc.Driver
      - EBEAN_DATASOURCE_HOST=mysql:3306
      - EBEAN_DATASOURCE_PASSWORD=datahub
      - EBEAN_DATASOURCE_URL=jdbc:mysql://mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8
      - EBEAN_DATASOURCE_USERNAME=datahub
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX=true
      - ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX=true
      - ELASTICSEARCH_BUILD_INDICES_CLONE_INDICES=false
      - ENTITY_REGISTRY_CONFIG_PATH=/datahub/datahub-gms/resources/entity-registry.yml
      - GRAPH_SERVICE_IMPL=elasticsearch
      - KAFKA_BOOTSTRAP_SERVER=broker:29092
      - KAFKA_SCHEMAREGISTRY_URL=http://schema-registry:8081
      - DATAHUB_SYSTEM_CLIENT_ID=__datahub_system
      - DATAHUB_SYSTEM_CLIENT_SECRET=JohnSnowKnowsNothing
      - DATAHUB_TOKEN_SERVICE_SIGNING_KEY=SmokeTestSigningKeyThatIsLongEnoughForHS256Algorithm2026!
      - DATAHUB_TOKEN_SERVICE_SALT=SmokeTestSaltValue2026
      - AUTHENTICATION_TOKENSERVICE_SIGNINGKEY=SmokeTestSigningKeyThatIsLongEnoughForHS256Algorithm2026!
      - AUTHENTICATION_TOKENSERVICE_SALT=SmokeTestSaltValue2026
      - SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=PLAINTEXT

  datahub-gms:
    image: acryldata/datahub-gms:v1.5.0.6
    container_name: dh-smoke-gms
    depends_on:
      datahub-upgrade:
        condition: service_completed_successfully
    environment:
      - DATAHUB_SERVER_TYPE=quickstart
      - DATAHUB_TELEMETRY_ENABLED=false
      - EBEAN_DATASOURCE_DRIVER=com.mysql.jdbc.Driver
      - EBEAN_DATASOURCE_HOST=mysql:3306
      - EBEAN_DATASOURCE_PASSWORD=datahub
      - EBEAN_DATASOURCE_URL=jdbc:mysql://mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8
      - EBEAN_DATASOURCE_USERNAME=datahub
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX=true
      - ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX=true
      - ENTITY_REGISTRY_CONFIG_PATH=/datahub/datahub-gms/resources/entity-registry.yml
      - ENTITY_SERVICE_ENABLE_RETENTION=true
      - GRAPH_SERVICE_IMPL=elasticsearch
      - JAVA_OPTS=-Xms1g -Xmx1g
      - KAFKA_BOOTSTRAP_SERVER=broker:29092
      - KAFKA_SCHEMAREGISTRY_URL=http://schema-registry:8081
      - MAE_CONSUMER_ENABLED=true
      - MCE_CONSUMER_ENABLED=true
      - METADATA_SERVICE_AUTH_ENABLED=true
      - NEO4J_HOST=http://neo4j:7474
      - NEO4J_PASSWORD=datahub
      - NEO4J_URI=bolt://neo4j
      - NEO4J_USERNAME=neo4j
      - PE_CONSUMER_ENABLED=true
      - UI_INGESTION_ENABLED=true
      - DATAHUB_SYSTEM_CLIENT_ID=__datahub_system
      - DATAHUB_SYSTEM_CLIENT_SECRET=JohnSnowKnowsNothing
      - DATAHUB_TOKEN_SERVICE_SIGNING_KEY=SmokeTestSigningKeyThatIsLongEnoughForHS256Algorithm2026!
      - DATAHUB_TOKEN_SERVICE_SALT=SmokeTestSaltValue2026
      - AUTHENTICATION_TOKENSERVICE_SIGNINGKEY=SmokeTestSigningKeyThatIsLongEnoughForHS256Algorithm2026!
      - AUTHENTICATION_TOKENSERVICE_SALT=SmokeTestSaltValue2026
      - SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=PLAINTEXT
    ports:
      - "8019:8080"
    volumes:
      - ./workspace:/app:ro
    healthcheck:
      test: curl -sS --fail http://datahub-gms:8080/health
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 90s

  datahub-frontend-react:
    image: acryldata/datahub-frontend-react:v1.5.0.6
    container_name: dh-smoke-frontend
    depends_on:
      datahub-gms:
        condition: service_healthy
    environment:
      - DATAHUB_GMS_HOST=datahub-gms
      - DATAHUB_GMS_PORT=8080
      - DATAHUB_SECRET=YouKnowNothing
      - JAVA_OPTS=-Xms256m -Xmx512m -Dhttp.port=9002
      - KAFKA_BOOTSTRAP_SERVER=broker:29092
      - ELASTIC_CLIENT_HOST=elasticsearch
      - ELASTIC_CLIENT_PORT=9200
    ports:
      - "9002:9002"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9002/ -o /dev/null || curl -sf http://localhost:9002/admin -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  mysql-data:
  esdata:
