server {
    listen 80 default_server;
    server_name _;

    root /app/build;
    index index.html;

    ssi on;
    ssi_types application/x-javascript application/javascript;

    location ~ ^/libs/.+$ {
        add_header Cache-Control "public, max-age=31536000";
        try_files $uri =404;
    }

    location ~ ^/(css|images|sounds|lang|fonts|static)/.+$ {
        add_header Cache-Control "public, max-age=31536000";
        try_files $uri =404;
    }

    location = /external_api.js {
        alias /app/build/libs/external_api.min.js;
    }

    location = /http-bind {
        proxy_pass http://xmpp:5280/http-bind;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        tcp_nodelay on;
    }

    location = /xmpp-websocket {
        proxy_pass http://xmpp:5280/xmpp-websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 900s;
        tcp_nodelay on;
    }

    location ~ ^/colibri-ws/ {
        proxy_pass http://jvb:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        tcp_nodelay on;
    }

    location = /config.js {
        alias /app/build/config.js;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
