name: task_mjobbzsi

services:
  app:
    container_name: mjobbzsi-app-1
    image: shadetocloak/task_mjobbzsi-app:${IMAGE_TAG:-baseline}
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT:-8026}:80"
    volumes:
      - ./workspace:/app
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8026}
      - XMPP_DOMAIN=${XMPP_DOMAIN:-conference.local}
      - XMPP_MUC_DOMAIN=${XMPP_MUC_DOMAIN:-muc.conference.local}
      - XMPP_BOSH_URL=/http-bind
      - XMPP_WEBSOCKET_URL=/xmpp-websocket
    depends_on:
      xmpp:
        condition: service_started
      jvb:
        condition: service_started
    networks:
      conference.net:
    restart: "no"
  xmpp:
    container_name: mjobbzsi-xmpp-1
    image: jitsi/prosody:stable-9823
    ports:
      - "${XMPP_PORT:-5222}:5222"
    expose:
      - "5280"
      - "5347"
    volumes:
      - ${CONFIG:-~/.conference-cfg}/prosody/config:/config:Z
      - ${CONFIG:-~/.conference-cfg}/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
    environment:
      - AUTH_TYPE=${AUTH_TYPE:-}
      - ENABLE_AUTH=${ENABLE_AUTH:-0}
      - ENABLE_AV_MODERATION=1
      - ENABLE_BREAKOUT_ROOMS=1
      - ENABLE_END_CONFERENCE=1
      - ENABLE_GUESTS=1
      - ENABLE_LOBBY=1
      - ENABLE_RECORDING=${ENABLE_RECORDING:-0}
      - ENABLE_TRANSCRIPTIONS=${ENABLE_TRANSCRIPTIONS:-0}
      - ENABLE_XMPP_WEBSOCKET=1
      - JICOFO_AUTH_PASSWORD=${FOCUS_AUTH_PASSWORD}
      - JVB_AUTH_USER=${JVB_AUTH_USER:-jvb}
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8026}
      - TZ=${TZ:-UTC}
      - XMPP_DOMAIN=${XMPP_DOMAIN:-conference.local}
      - XMPP_AUTH_DOMAIN=auth.${XMPP_DOMAIN:-conference.local}
      - XMPP_GUEST_DOMAIN=guest.${XMPP_DOMAIN:-conference.local}
      - XMPP_MUC_DOMAIN=muc.${XMPP_DOMAIN:-conference.local}
      - XMPP_INTERNAL_MUC_DOMAIN=internal.auth.${XMPP_DOMAIN:-conference.local}
      - XMPP_HIDDEN_DOMAIN=recorder.${XMPP_DOMAIN:-conference.local}
      - XMPP_RECORDER_DOMAIN=recorder.${XMPP_DOMAIN:-conference.local}
      - XMPP_PORT=5222
    networks:
      conference.net:
        aliases:
          - xmpp.conference.local
    restart: "no"
  focus:
    container_name: mjobbzsi-focus-1
    image: jitsi/jicofo:stable-9823
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ${CONFIG:-~/.conference-cfg}/focus:/config:Z
    environment:
      - AUTH_TYPE=${AUTH_TYPE:-}
      - ENABLE_AUTH=${ENABLE_AUTH:-0}
      - ENABLE_AUTO_OWNER=true
      - ENABLE_CODEC_VP8=true
      - ENABLE_CODEC_VP9=true
      - ENABLE_CODEC_AV1=true
      - ENABLE_CODEC_H264=true
      - ENABLE_RECORDING=${ENABLE_RECORDING:-0}
      - ENABLE_SCTP=true
      - JICOFO_AUTH_PASSWORD=${FOCUS_AUTH_PASSWORD}
      - JVB_BREWERY_MUC=jvbbrewery
      - TZ=${TZ:-UTC}
      - XMPP_DOMAIN=${XMPP_DOMAIN:-conference.local}
      - XMPP_AUTH_DOMAIN=auth.${XMPP_DOMAIN:-conference.local}
      - XMPP_INTERNAL_MUC_DOMAIN=internal.auth.${XMPP_DOMAIN:-conference.local}
      - XMPP_MUC_DOMAIN=muc.${XMPP_DOMAIN:-conference.local}
      - XMPP_SERVER=xmpp.conference.local
      - XMPP_PORT=5222
    depends_on:
      - xmpp
    networks:
      conference.net:
    restart: "no"
  jvb:
    container_name: mjobbzsi-jvb-1
    image: jitsi/jvb:stable-9823
    ports:
      - "${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp"
      - "127.0.0.1:8080:8080"
    expose:
      - "9090"
    volumes:
      - ${CONFIG:-~/.conference-cfg}/jvb:/config:Z
    environment:
      - ENABLE_COLIBRI_WEBSOCKET=1
      - ENABLE_SCTP=true
      - JVB_AUTH_USER=${JVB_AUTH_USER:-jvb}
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
      - JVB_BREWERY_MUC=jvbbrewery
      - JVB_PORT=${JVB_PORT:-10000}
      - JVB_STUN_SERVERS=stun.l.google.com:19302
      # The jvb.conf template derives the colibri-ws domain from PUBLIC_URL but only
      # strips an "https://" prefix, so an http:// PUBLIC_URL yields the malformed
      # "wss://http://localhost:8026/colibri-ws/..." domain → the client can never
      # establish the bridge channel and the conference shows "disconnected/reconnecting".
      # Pin the websocket domain (no scheme) + disable TLS since 8026 serves plain ws.
      - JVB_WS_DOMAIN=${JVB_WS_DOMAIN:-localhost:8026}
      - JVB_WS_TLS=0
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8026}
      - SENTRY_DSN=0
      - TZ=${TZ:-UTC}
      - XMPP_AUTH_DOMAIN=auth.${XMPP_DOMAIN:-conference.local}
      - XMPP_INTERNAL_MUC_DOMAIN=internal.auth.${XMPP_DOMAIN:-conference.local}
      - XMPP_SERVER=xmpp.conference.local
      - XMPP_PORT=5222
    depends_on:
      - xmpp
    networks:
      conference.net:
    restart: "no"
networks:
  conference.net:
