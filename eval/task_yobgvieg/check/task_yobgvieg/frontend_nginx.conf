worker_processes 2;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  access_log /dev/stdout;
  error_log /dev/stderr;

  # Single-origin SPA: serve the React-Router static build AND reverse-proxy
  # the API/auth surface to the Plane backend (host :8032) so the browser
  # sees one origin (:8033). This makes session cookies + same-origin XHR
  # work without CORS, which is required for the FRONTEND_* rendered_dom
  # judges to reach authenticated app surfaces.
  server {
    listen 8033;
    client_max_body_size 50m;

    location /api/      { proxy_pass http://127.0.0.1:8032; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /auth/     { proxy_pass http://127.0.0.1:8032; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /god-mode/ { proxy_pass http://127.0.0.1:8032; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location /spaces/   { proxy_pass http://127.0.0.1:8032; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }

    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
  }
}
