# Apache 2.4 vhost for the task_lgzivily Clinical Practice Management Suite.
#
# - DocumentRoot is /var/www/html (where the agent's workspace is mounted).
# - mod_rewrite is enabled (.htaccess support via AllowOverride All) so that
#   the application can install its own front controller / SPA fallback.
# - PassEnv pushes the 11 environment variables from .env into PHP's $_SERVER.

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # PHP environment variables — all 11 entries declared in .env
    PassEnv APP_ENV APP_BASE_URL SITE_ID
    PassEnv DATABASE_DSN DATABASE_HOST DATABASE_PORT DATABASE_NAME DATABASE_USER DATABASE_PASSWORD
    PassEnv OAUTH2_KEYS_DIR OAUTH2_ACCESS_TOKEN_LIFETIME OAUTH2_REFRESH_TOKEN_LIFETIME
    PassEnv SESSION_TIMEOUT_SECONDS APP_SECRET LOG_LEVEL TIMEZONE

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        RewriteEngine On

        # Convenience aliases for SMART-on-FHIR / OIDC discovery — the spec
        # exposes /.well-known/{smart-configuration,openid-configuration} at
        # root, but OpenEMR-style apps physically serve them under
        # /apis/{site}/fhir/.well-known/ and /oauth2/{site}/.well-known/.
        # If the application ships its own /.well-known/* file, that file
        # wins (the rewrite only fires when the request doesn't resolve to
        # an existing file).
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^\.well-known/smart-configuration$  /apis/default/fhir/.well-known/smart-configuration   [PT,L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^\.well-known/openid-configuration$ /oauth2/default/.well-known/openid-configuration     [PT,L]

        # Redirect all other non-existing files to /index.php so the app's
        # front controller can dispatch.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.php [QSA,L]
    </Directory>

    # Forbid access to the sites/{site}/documents directory directly via HTTP
    # (clinical documents must go through the application's authorization layer).
    <Directory /var/www/html/sites/*/documents>
        Require all denied
    </Directory>

    # Forbid access to OAuth2 keypairs.
    <Directory /var/www/html/sites/*/documents/oauth2>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Increase the body size for clinical document uploads (mirrors PHP).
    LimitRequestBody 134217728

    # OAuth2 / SMART-on-FHIR JWTs frequently exceed the default 8 KB header
    # limit because they carry the full SMART scope set (50+ resource scopes
    # for `system/*`). Allow up to 32 KB per header field/line.
    LimitRequestFieldSize 32768
    LimitRequestLine      32768

    # CORS for FHIR / SMART on FHIR clients (the application MAY tighten this
    # at runtime via its own middleware; this is a permissive default for dev).
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, x-requested-with"
</VirtualHost>
